  <style>
    body {
      margin: 0;
      background: #222;
      color: white;
      font-family: sans-serif;
    }

    /* ヘッダー画像 */
    .hero {
      width: 100%;
      height: 300px;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* タイトル */
    header {
      text-align: center;
      padding: 40px 20px 30px;
    }

    h1 {
      font-size: 50px;
      letter-spacing: 8px;
      margin: 0;
    }

    .subtitle {
      margin-top: 15px;
      color: #aaa;
      letter-spacing: 5px;
    }

    /* 話数一覧 */
    .episodes {
      max-width: 600px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .episode {
      display: block;
      background: #333;
      color: white;
      text-decoration: none;
      padding: 20px;
      margin-bottom: 10px;
      border-radius: 5px;
      font-size: 20px;
      transition: background 0.2s;
    }

    .episode:hover {
      background: #444;
    }

    /* フッター */
    footer {
      text-align: center;
      padding: 70px 20px 40px;
      color: #aaa;
      font-size: 14px;
    }

    .social-links {
      margin-top: 20px;
    }

    .social-links a {
      color: white;
      text-decoration: none;
      margin: 0 12px;
      font-size: 16px;
    }

    .social-links a:hover {
      color: #ccc;
    }

    /* スマホ用 */
    @media (max-width: 600px) {
      .hero {
        height: 200px;
      }

      h1 {
        font-size: 38px;
        letter-spacing: 5px;
      }

      .subtitle {
        font-size: 13px;
        letter-spacing: 3px;
      }
    }
  </style>
</head>
